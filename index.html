<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>T & A</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@400;600&display=swap">
  <style>
    :root {
      --sky1: #2a2250;
      --sky2: #6b3a6e;
      --sky3: #e58a8a;
      --hi: #fff;
      --sub: #f6dfe6;
      --paper: #fff8f0;
      --ink: #3b2a33;
      --acc: #ff8fa3;
      --h1: #4a2a6e;
      --h2: #8a3f86;
      --h3: #2f2a5e;
      --star: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:light) {
      :root:not([data-theme="dark"]) {
        --sky1: #ffd9d2;
        --sky2: #ffc2cf;
        --sky3: #fff1e6;
        --hi: #4a2433;
        --sub: #7a4a5a;
        --acc: #d6385a;
        --h1: #ffb3c1;
        --h2: #ffd08a;
        --h3: #c9a8ff;
        --star: rgba(255, 255, 255, .95)
      }
    }

    :root[data-theme="light"] {
      --sky1: #ffd9d2;
      --sky2: #ffc2cf;
      --sky3: #fff1e6;
      --hi: #4a2433;
      --sub: #7a4a5a;
      --acc: #d6385a;
      --h1: #ffb3c1;
      --h2: #ffd08a;
      --h3: #c9a8ff;
      --star: rgba(255, 255, 255, .95)
    }

    * {
      box-sizing: border-box
    }

    html {
      min-height: 100%;
      background: var(--sky2)
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--hi);
      font-family: "Lora", Georgia, serif;
      background: radial-gradient(1.5px 1.5px at 20px 30px, var(--star), transparent), radial-gradient(1px 1px at 90px 120px, var(--star), transparent), radial-gradient(2px 2px at 160px 70px, var(--star), transparent), linear-gradient(180deg, var(--sky1), var(--sky2) 60%, var(--sky3));
      background-size: 230px 200px, 170px 240px, 310px 180px, 100% 100%;
      background-repeat: repeat-x, repeat-x, repeat-x, no-repeat;
      background-attachment: scroll, scroll, scroll, fixed
    }

    .sun {
      position: fixed;
      right: 6vw;
      top: calc(env(safe-area-inset-top, 0px) + 24px);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbe0, #ffe08a);
      box-shadow: 0 0 40px 12px rgba(255, 224, 138, .5);
      pointer-events: none
    }

    .hills {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 190px;
      pointer-events: none;
      z-index: 0
    }

    .fl {
      position: fixed;
      bottom: -40px;
      opacity: .7;
      animation: up linear infinite;
      pointer-events: none;
      z-index: 0
    }

    @keyframes up {
      to {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0
      }
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 44px 20px 140px
    }

    .hero {
      text-align: center;
      margin-bottom: 34px
    }

    .hero small {
      font-size: 1rem;
      color: var(--sub)
    }

    h1 {
      font-family: "Caveat", cursive;
      font-size: clamp(3rem, 11vw, 5.4rem);
      line-height: 1;
      margin: 6px 0 10px;
      font-weight: 700
    }

    .days {
      display: inline-block;
      background: rgba(255, 255, 255, .16);
      backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      padding: 8px 20px;
      color: var(--hi);
      font-size: .98rem
    }

    .days b {
      font-family: "Caveat", cursive;
      font-size: 1.7rem;
      color: var(--acc);
      margin-right: 4px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px
    }

    .card {
      display: block;
      text-decoration: none;
      color: var(--ink);
      background: var(--paper);
      border-radius: 18px;
      padding: 22px 20px 18px;
      border-bottom: 8px solid var(--c);
      box-shadow: 0 12px 24px rgba(0, 0, 0, .28);
      transform: rotate(var(--r));
      transition: transform .35s cubic-bezier(.3, 1.5, .5, 1), box-shadow .3s;
      opacity: 0;
      animation: in .6s ease-out forwards;
      animation-delay: calc(var(--i) * 90ms + .2s)
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(24px) rotate(var(--r))
      }

      to {
        opacity: 1;
        transform: rotate(var(--r))
      }
    }

    .card:hover,
    .card:focus-visible {
      transform: rotate(0) translateY(-6px) scale(1.02);
      box-shadow: 0 18px 30px rgba(0, 0, 0, .35);
      outline: none
    }

    .card:focus-visible {
      outline: 3px solid var(--c);
      outline-offset: 3px
    }

    .ic {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      background: var(--c);
      margin-bottom: 12px;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15)
    }

    .card h2 {
      font-family: "Caveat", cursive;
      font-size: 2rem;
      margin: 0;
      line-height: 1.05;
      color: var(--c)
    }

    .card p {
      margin: 6px 0 14px;
      font-size: .92rem;
      line-height: 1.5
    }

    .go {
      font-weight: 600;
      font-size: .9rem;
      color: var(--c)
    }

    .soon {
      background: transparent;
      border: 2px dashed rgba(255, 255, 255, .5);
      border-bottom-width: 2px;
      color: var(--hi);
      box-shadow: none;
      text-align: center;
      pointer-events: none
    }

    .soon .ic {
      background: rgba(255, 255, 255, .18);
      margin: 0 auto 12px
    }

    .soon h2 {
      color: var(--hi)
    }

    @media (prefers-reduced-motion:reduce) {
      .fl {
        display: none
      }

      .card {
        animation: none;
        opacity: 1;
        transition: none
      }
    }
  </style>
</head>

<body>
  <div class="sun" aria-hidden="true"></div>
  <svg class="hills" id="hills" viewBox="0 0 1200 190" preserveAspectRatio="none" aria-hidden="true"></svg>
  <main>
    <header class="hero">
      <small id="greet"></small>
      <h1 id="naam"></h1>
      <div class="days" id="days"></div>
    </header>
    <section class="grid" id="grid" aria-label="Onze websites"></section>
  </main>
  <script>
    var NAAM = "Liefste laddyyy";            
    var START = "2026-10-14";        
    var SITES = [                   
      { t: "Date websiteee", x: "Jou vragen voor een dateee", e: "💌", href: "date-index.html"},
      { t: "Missies", x: "Websitee waar ik jou vroeg om samen te gaannnn", e: "🗺️", href: "mission.html" },
      { t: "Tijdlijn", x: "Al onze herinneringen kun je hier vinden", e: "📸", href: "tijdlijn.html" },
      //{ t: "Website 4", x: "Een korte omschrijving van deze website.", e: "📸", href: "#" }
    ];
    /* ================================== */
    var cols = ["#e8486b", "#e8801a", "#1f9d6b", "#2f7fd8", "#8a4fd6", "#d4a017"], $ = function (i) { return document.getElementById(i) };
    var hr = new Date().getHours();
    $("greet").textContent = hr < 6 ? "Slaap lekker" : hr < 12 ? "Goedemorgen" : hr < 18 ? "Goedemiddag" : "Goedenavond";
    $("naam").textContent = NAAM + " ♥";
    var n = Math.floor((Date.now() - new Date(START + "T00:00:00")) / 864e5);
    $("days").innerHTML = n >= 0 ? '<b>' + n.toLocaleString("nl-BE") + '</b> daysss togetherrrrr' : '';
    if (n < 0) $("days").hidden = true;
    $("grid").innerHTML = SITES.map(function (s, i) {
      var c = cols[i % cols.length], r = (i % 2 ? 1.6 : -1.6);
      return '<a class="card" href="' + s.href + '" style="--c:' + c + ';--r:' + r + 'deg;--i:' + i + '"><div class="ic" aria-hidden="true">' + s.e + '</div><h2>' + s.t + '</h2><p>' + s.x + '</p><span class="go">Openen →</span></a>'
    }).join("") +
      '<div class="card soon" style="--r:0deg;--i:' + SITES.length + '"><div class="ic" aria-hidden="true">✨</div><h2>Binnenkort meer…</h2><p>Er komt nog meer moois aan.</p></div>';
    function hill(mid, amp, off, col) { var d = "M0,190"; for (var x = 0; x <= 1200; x += 30)d += " L" + x + "," + (mid + Math.sin(x / (120 + off * 25) + off) * amp); return '<path d="' + d + ' L1200,190Z" fill="var(' + col + ')"/>' }
    $("hills").innerHTML = hill(70, 22, 1, "--h3") + hill(105, 18, 2.5, "--h1") + hill(140, 12, 4, "--h2");
    var fe = ["💗", "✨", "🎈", "💛", "🌸", "⭐"], f = "";
    for (var k = 0; k < 14; k++)f += '<span class="fl" aria-hidden="true" style="left:' + Math.round(Math.random() * 96) + 'vw;font-size:' + (1 + Math.random() * 1.2).toFixed(1) + 'rem;animation-duration:' + (14 + Math.random() * 16).toFixed(0) + 's;animation-delay:-' + (Math.random() * 24).toFixed(0) + 's">' + fe[k % fe.length] + '</span>';
    document.body.insertAdjacentHTML("beforeend", f);
  </script>
</body>

</html>
