<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Even checken wie je bent</title>
<style>

  /* ============================================================
     PAS HIER ZELF DE VERWACHTE ANTWOORDEN AAN
     ============================================================ */
  /* Zoek verderop naar EXPECTED_NAME en EXPECTED_DATE in de <script>
     en vul daar de juiste naam en datum in. */

  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper: #f3f1fa;
    --paper-edge: #dcd3f0;
    --ink: #2f2a3d;
    --wine: #2ea0a0;
    --wine-deep: #1f7a7a;
    --blush: #f3b6d3;
    --gold: #b98fd1;
    --error: #c0577a;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at top left, #faf8fd 0%, var(--paper) 55%, var(--paper-edge) 100%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 18px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(46,160,160,0.05) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(185,143,209,0.07) 0, transparent 40%);
    pointer-events:none;
  }

  .card{
    position:relative;
    max-width: 420px;
    width:100%;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 30px 60px -20px rgba(58,42,46,0.25);
    padding: 52px 40px 44px;
    text-align:center;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--gold);
    opacity:0.35;
    pointer-events:none;
  }

  .eyebrow{
    font-family:'Caveat', cursive;
    font-size: 1.45rem;
    line-height: 1.3;
    color: var(--wine);
    margin: 0 12px 2px;
    transform: rotate(-1deg);
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(1.6rem, 4.5vw, 2rem);
    line-height:1.3;
    margin: 4px 0 6px;
    color: var(--wine-deep);
  }

  .sub{
    font-size:1rem;
    color:#6e6480;
    margin: 0 0 28px;
  }

  .divider{
    width:64px;
    height:1px;
    background: var(--gold);
    opacity:0.5;
    margin: 0 auto 28px;
  }

  form{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap: 18px;
    text-align:left;
  }

  label{
    font-family:'Caveat', cursive;
    font-size: 1.2rem;
    color: var(--wine-deep);
    margin-bottom: -10px;
  }

  input{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.1rem;
    padding: 11px 14px;
    border: 1px solid var(--paper-edge);
    background: #fdfcfe;
    color: var(--ink);
    border-radius: 2px;
    outline:none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input:focus{
    border-color: var(--wine);
    box-shadow: 0 0 0 3px rgba(46,160,160,0.15);
  }

  button{
    margin-top: 6px;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    padding: 14px 30px;
    border-radius: 2px;
    cursor:pointer;
    letter-spacing: 0.02em;
    background: var(--wine);
    color: var(--paper);
    border: 1px solid var(--wine);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
    padding-right: 38px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }

  button:hover{
    background: var(--wine-deep);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px -6px rgba(31,122,122,0.45);
  }

  .message{
    display:none;
    margin-top: 20px;
    font-family:'Caveat', cursive;
    font-size: 1.6rem;
  }

  .message.show{
    display:block;
    animation: fadeUp 0.5s ease forwards;
  }

  .message.success{ color: var(--wine); }
  .message.error{ color: var(--error); }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .heart{
    position:fixed;
    pointer-events:none;
    font-size: 1.2rem;
    color: var(--blush);
    opacity:0.9;
    z-index: 5;
    user-select:none;
  }

  .fine{
    margin-top: 24px;
    font-size: 0.85rem;
    color:#a99cc0;
    font-style: italic;
  }

.buttons {
  width: 210px;
  height: 80px;
  font-family: cursive;
  font-size: 25px;
  position: absolute;
  border: 2px solid #f2c2c8;
  border-radius: 9px;
}

#button {
  background: linear-gradient(70deg, #FFE5E9, #FFC3CC);
  color: #F05757;
  position: absolute;
  top: 50%;
  left: 50%;
  margin-top: -40px;
  margin-left: -105px;
  outline: none;
  box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
}

#heart1 {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -25px;
    margin-left: -150px;
    background-color: #ffdae0;
    height: 50px;
    width: 50px;
    opacity: 0;
}

#heart2 {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -90px;
    margin-left: -50px;
    background-color: #ffdae0;
    height: 50px;
    width: 50px;
    opacity: 0;
}

#heart3 {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: 50px;
    margin-left: -50px;
    background-color: #ffdae0;
    height: 50px;
    width: 50px;
    opacity: 0;
}

#heart4 {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -90px;
    margin-left: 100px;
    background-color: #ffdae0;
    height: 50px;
    width: 50px;
    opacity: 0;
}

#heart5 {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: 25px;
    margin-left: 100px;
    background-color: #ffdae0;
    height: 50px;
    width: 50px;
    opacity: 0;
}

.hearts:after {
    background-color: #ffdae0;
    content: "";
    border-radius: 50%;
    position: absolute;
    width: 50px;
    height: 50px;
    top: 0px;
    left: 25px;
  }
  .hearts:before {
    background-color: #ffdae0;
    content: "";
    border-radius: 50%;
    position: absolute;
    width: 50px;
    height: 50px;
    top: -25px;
    left: 0px;
  }

.love:hover > #heart1 {
  animation-name: hearts1;
  animation-duration: 1.1s;
  animation-iteration-count: infinite;
}
.love:hover > #heart2 {
  animation-name: hearts2;
  animation-duration: 0.9s;
  animation-iteration-count: infinite;
}
.love:hover > #heart3 {
  animation-name: hearts3;
  animation-duration: 0.9s;
  animation-iteration-count: infinite;
}
.love:hover > #heart4 {
  animation-name: hearts4;
  animation-duration: 1s;
  animation-iteration-count: infinite;
}
.love:hover > #heart5 {
  animation-name: hearts5;
  animation-duration: 1.1s;
  animation-iteration-count: infinite;
}

@keyframes hearts1 {
  0% {
    transform: scale(0.1, 0.1) rotate(-45deg);
    opacity: 0.8;
  } 
}
@keyframes hearts2 {
  20% {
    transform: scale(0.2, 0.2) rotate(-45deg);
    opacity: 0.8;
  }
}
@keyframes hearts3 {
  40% {
    transform: scale(0.3, 0.3) rotate(-45deg);
    opacity: 0.8;
  }
}
@keyframes hearts4 {
  60% {
    transform: scale(0.4, 0.4) rotate(-45deg);
    opacity: 0.8;
  }
}
@keyframes hearts5 {
  80% {
    transform: scale(0.6, 0.6) rotate(-45deg);
    opacity: 0.8;
  }
}

#button:active {
  box-shadow: 0 5px 5px rgba(0,0,0,0.23);
  transform: scale(0.99);
}
</style>
</head>
<body>

  <div class="card">
    <p class="eyebrow">&ldquo;Say my name.&rdquo;</p>
    <h1>Wie klopt er aan?</h1>
    <p class="sub">Vul je naam en de juiste datum in</p>
    <div class="divider"></div>

    <form id="loginForm" autocomplete="off">
      <div>
        <label for="nameInput">jouw naam</label>
        <input type="text" id="nameInput" name="naam" placeholder="Naam pwss" required />
      </div>
      <div>
        <label for="dateInput">de datum</label>
        <input type="date" id="dateInput" name="datum" required />
      </div>
            <div class="love">
      <button type="submit" id="button" class="buttons">Love</button>
      <div id="heart1" class="hearts"></div>
      <div id="heart2" class="hearts"></div>
      <div id="heart3" class="hearts"></div>
      <div id="heart4" class="hearts"></div>
      <div id="heart5" class="hearts"></div>
    </div>
      <button type="submit">Naar binnen</button>
    </form>

    <p class="message" id="message"></p>
    <p class="fine">alleen voor wie het antwoord al weet 🤫</p>
  </div>

<script src="secrets.js"></script>
<script>

  /* ============================================================
     Waar de gebruiker heen gaat na een juist antwoord.
     ============================================================ */
  const REDIRECT_URL = "date-invite.html";

  const form = document.getElementById('loginForm');
  const nameInput = document.getElementById('nameInput');
  const dateInput = document.getElementById('dateInput');
  const message = document.getElementById('message');

  function normalize(str){
    return str.trim().toLowerCase();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const nameOk = normalize(nameInput.value) === normalize(EXPECTED_NAME);
    const dateOk = dateInput.value === EXPECTED_DATE;

    message.classList.remove('success', 'error', 'show');

    if(nameOk && dateOk){
      message.textContent = "Welkom. Je mag naar binnen. 💌";
      message.classList.add('success', 'show');
      launchHearts();
      setTimeout(() => {
        window.location.href = REDIRECT_URL + '?code=' + encodeURIComponent(SECRET_CODE);
      }, 1000);
    } else {
      message.textContent = "Hmm, dat klopt nog niet helemaal. Probeer opnieuw.";
      message.classList.add('error', 'show');
    }
  });

  function launchHearts(){
    const emojis = ['❤','♥','❥'];
    for(let i=0; i<14; i++){
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        h.style.left = Math.random()*100 + 'vw';
        h.style.top = '105vh';
        h.style.fontSize = (14 + Math.random()*18) + 'px';
        document.body.appendChild(h);

        const duration = 3200 + Math.random()*1800;
        const drift = (Math.random()-0.5) * 120;

        h.animate([
          { transform: 'translate(0,0) rotate(0deg)', opacity: 0.9 },
          { transform: `translate(${drift}px, -110vh) rotate(${(Math.random()>0.5?1:-1)*180}deg)`, opacity: 0 }
        ], { duration, easing: 'ease-out', fill: 'forwards' });

        setTimeout(() => h.remove(), duration + 100);
      }, i * 90);
    }
  }
</script>

</body>
</html>
